          claude_args: "--max-turns 5"`},{label:"Use it",code:"(PR comment)  @claude review this for missing error handling"}],result:"Reviews and small fixes happen right in GitHub, capped at 5 turns."},caveman:"/install-github-app. Write @claude in PR. Claude answer. Only write-access people. Old @beta → @v1, direct_prompt → prompt.",quiz:[{q:"In `claude-code-action@v1`, `direct_prompt` became…",options:["prompt","ask","query","It's unchanged"],answer:0,why:"One of four @beta → @v1 changes."},{q:"Who can trigger the action with @claude?",options:["Anyone on the internet","Users with write access","Only admins","Only bots"],answer:1,why:"Write access is required."},{q:"Where do `max_turns` and `model` go in v1?",options:["Top-level inputs","Inside claude_args","In CLAUDE.md","They were removed"],answer:1,why:"They moved into claude_args."}],sources:[{label:"GitHub Actions",url:S+"github-actions"}]},{id:"l5-sdk",title:"The Claude Agent SDK",minutes:7,intuition:((...e)=>e.join("\n"))("The engine behind Claude Code is available as a library, so you can build your own agents in Python or TypeScript: a support bot that reads logs, a data agent, an internal tool.","It used to be called the Claude Code SDK. It's now the **Claude Agent SDK**."),analogy:((...e)=>e.join("\n"))("Claude Code is a finished car. The Agent SDK is the same engine and gearbox sold separately, so you can build a truck, a boat or a go-kart around it."),formal:((...e)=>e.join("\n"))("- **Renamed:** TypeScript `@anthropic-ai/claude-agent-sdk`; Python `claude-agent-sdk` (import `claude_agent_sdk`); `ClaudeCodeOptions` → `ClaudeAgentOptions`.","- The CLI itself still installs from `@anthropic-ai/claude-code`; only the SDK moved.","- Since v0.1.0, the SDK **does not use Claude Code's system prompt by default**. Pass the `claude_code` preset for CLI-like behavior.","- Omitting `settingSources` loads your settings and CLAUDE.md; `settingSources: []` isolates the run.","- Products built on the SDK must use **API keys** (not claude.ai login) and must not be branded “Claude Code”."),example:{title:"Hello, agent (Python)",steps:[{label:"Install",code:"pip install claude-agent-sdk"},{label:"agent.py",code:`import asyncio
from claude_agent_sdk import query, ClaudeAgentOptions

async def main():
    opts = ClaudeAgentOptions(system_prompt={"type": "preset", "preset": "claude_code"})
    async for message in query(prompt="List the TODOs in this repo", options=opts):
        print(message)

asyncio.run(main())`}],result:"Twelve lines give you a scripted agent with Claude Code's tools and behavior."},caveman:"SDK = Claude Code engine as library. New name: Claude Agent SDK. No default system prompt now, ask preset. Product need API key.",quiz:[{q:"What's the Python package name now?",options:["claude-code-sdk","claude-agent-sdk","anthropic-code","cc-sdk"],answer:1,why:"Renamed from claude-code-sdk."},{q:"How do you get Claude Code's system prompt in the SDK?",options:["It's always on","Pass the claude_code preset","Copy it from GitHub","Impossible"],answer:1,why:"No default system prompt since v0.1.0."},{q:"A product built on the SDK must authenticate with…",options:["claude.ai login","API keys","GitHub tokens","Nothing"],answer:1,why:"SDK products must use API keys."}],sources:[{label:"Agent SDK overview",url:S+"agent-sdk/overview"},{label:"Migration guide",url:S+"agent-sdk/migration-guide"}]},{id:"l5-cost",title:"Cost, limits and model choice",minutes:9,intuition:((...e)=>e.join("\n"))("Cost follows three dials: **which model**, **how much effort**, and **how much context** each turn re-sends. Turn the right dial and you can do more within the same plan."),analogy:((...e)=>e.join("\n"))("Driving costs: the car you pick (model), how hard you press the pedal (effort), and how much luggage you haul on every trip (context). Don't drive the truck, flooring it, with a full trailer to buy milk."),formal:((...e)=>e.join("\n"))("**Benchmark:** about **$13 per developer per active day**, $150 to $250 per month, with 90% of users under $30 per active day (enterprise deployments).","**Worked example:** 15 active days × $13 ≈ **$195/month**. Let parallel agents push 4 of those days to $30: 11 × 13 + 4 × 30 = 143 + 120 = **$263**, already past the top of the band.","**Levers, roughly by impact:**","1. **Model:** “Sonnet handles most coding tasks well and costs less than Opus.” Use `model: haiku` for simple subagents.","2. **Effort:** lower `/effort` for routine work; thinking is billed as output.","3. **Context:** `/clear` between tasks (it costs nothing), lean CLAUDE.md, delegate noisy test runs to subagents.","4. **Filter output:** a PreToolUse hook can pipe `npm test` through `grep … | head -100`.","- **Tools:** `/usage` (cost, plan bars, attribution), `/insights` (HTML report), `/usage-credits` (buy overflow).","- **Limits:** “session” and “weekly” limits apply across all models, so switching models won't help; after an “Opus limit”, switching families does.","- Agent teams use about **7× more tokens**. November's top complaint: parallel agents and Projects threads burning limits in minutes."),example:{title:"Same feature, half the cost",steps:[{label:"Before",text:"Opus at max effort, one long session doing five tasks, full test logs in context."},{label:"After",text:"`/model sonnet` for implementation, `/effort medium`, `/clear` between tasks, a Haiku subagent runs tests and returns only failures."}],result:"Same output, far fewer tokens per turn. Check the difference in `/usage` attribution."},caveman:"Cost = model × effort × context. Sonnet most job. Haiku small helper. /clear free. Big agent team eat 7x token.",quiz:[{q:"Anthropic's average enterprise cost per developer per active day is about…",options:["$1","$13","$130","$1,300"],answer:1,why:"~$13/active day, $150–250/month."},{q:"You hit a weekly limit. Will switching to Haiku help?",options:["Yes","No, session/weekly limits apply across all models","Only on weekends","Only in plan mode"],answer:1,why:"Only model-specific limits (like an Opus limit) are helped by switching."},{q:"Which costs nothing and often saves the most?",options:["/clear between tasks","Max effort","More MCP servers","Longer CLAUDE.md"],answer:0,why:"Stops old context being re-sent every turn."}],sources:[{label:"Costs",url:S+"costs"}]}]},{id:"l6",num:6,title:"Professional practice",rank:"Professional",tagline:"Security, team configuration, and the habits that separate pros from hype.",goal:"Run Claude Code safely on a team, with committed config, enforced policy, human review and honest measurement.",project:{title:"Team-ready repo",brief:"Make one repository team-ready: committed config, secrets protected, sandbox on, a review workflow, and a one-page README for teammates.",checklist:["Committed .claude/settings.json, CLAUDE.md, .claude/skills/ and .claude/agents/","Added `.claude/*.local.*` to .gitignore and a pre-commit secret scan","Turned on `/sandbox` and tested a blocked network call","Documented the writer/reviewer workflow for your team","Measured one week of your own tasks: time with and without Claude"]},lessons:[{id:"l6-security",title:"Security: the lessons already learned the hard way",minutes:9,intuition:((...e)=>e.join("\n"))("An agent that can run any command you can run can also make any mistake you can make, faster. Professional use means deciding what Claude is **not** allowed to do, and assuming that prompts and repos can be hostile."),analogy:((...e)=>e.join("\n"))("Giving a very fast new employee keys to the building. You don't hand them the master key on day one; you give them the rooms they need and lock the server room, however trustworthy they seem."),formal:((...e)=>e.join("\n"))('**Sandbox (off by default):** `/sandbox` or `"sandbox": {"enabled": true}`. Seatbelt on macOS, bubblewrap on Linux/WSL2, nothing on native Windows. Writes are limited to the working directory, but **reads cover most of the machine** (including `~/.ssh`); network goes through an allowlist that starts empty. Set `failIfUnavailable: true` and `allowUnsandboxedCommands: false`.',"**Bypass:** `--dangerously-skip-permissions` checks nothing; only in a container, VM or the sandbox runtime.","**Real incidents:**","- Dec 2025: Claude Code ran `rm -rf tests/ patches/ plan/ ~/`; the trailing `~/` wiped a user's home directory.","- Nov 2026: account email appearing in User-Agent headers; v2.1.317 now asks before a call sends it.","- Nov 2026: clicking “Don't ask again” on a command containing a secret saved it into `.claude/settings.local.json`; such files were committed in about 1,100 public repos. Claude Code only adds that file to your **global** git excludes, so add `.claude/*.local.*` to each repo's `.gitignore` and scan for secrets before commit.","- Oct 2026: a backdoored “Claude Code for VS Code” extension on Open VSX. Install only from official publishers.","**Prompt injection:** content Claude reads (web pages, issues, files) can contain instructions. Keep risky actions behind permissions."),example:{title:"Hardening checklist in 5 minutes",steps:[{label:"Deny secrets",code:'"deny": ["Read(./.env)", "Read(./.env.*)", "Read(~/.ssh/**)"]'},{label:"Ignore local settings",code:"echo '.claude/*.local.*' >> .gitignore"},{label:"Sandbox on",code:"/sandbox"},{label:"Bypass only in a box",code:"docker run … claude --dangerously-skip-permissions"}],result:"The most common real-world failures (wiped files, leaked secrets, malicious extensions) are now blocked or contained."},caveman:"Agent fast. Mistake fast too. Sandbox on. Deny secret file. .local file in gitignore. Bypass only in box. Extension only official.",pitfall:"Assuming auto mode makes you safe. Anthropic says it reduces prompts but does not guarantee safety.",quiz:[{q:"Is the OS sandbox on by default?",options:["Yes","No, turn it on with /sandbox","Only on Windows","Only in CI"],answer:1,why:"It's off by default."},{q:"Why add `.claude/*.local.*` to each repo's .gitignore?",options:["Style","Secrets saved via “Don't ask again” can land there and get committed","It's required to start","It speeds up git"],answer:1,why:"~1,100 public repos leaked secrets that way."},{q:"What did the trailing `~/` in the Dec 2025 incident do?",options:["Nothing","Deleted the user's home directory","Opened a browser","Logged out"],answer:1,why:"A one-character mistake with huge reach."}],sources:[{label:"Sandboxing",url:S+"sandboxing"},{label:"Security",url:S+"security"}]},{id:"l6-team",title:"Team configuration and managed policy",minutes:8,intuition:((...e)=>e.join("\n"))("On a team, the repository **is** the configuration. Commit the settings, memory, skills, agents and MCP servers so everyone gets the same Claude. Above that, admins can enforce policy that individuals can't turn off."),analogy:((...e)=>e.join("\n"))("A shared kitchen: the recipe book and labeled shelves live in the kitchen (the repo), so every cook works the same way. The building's fire code (managed policy) applies no matter which cook is on shift."),formal:((...e)=>e.join("\n"))("**Commit:** `.claude/settings.json` (permissions, hooks), `CLAUDE.md` and `.claude/rules/` (guidance), `.claude/skills/` and `.claude/agents/` (procedures), `.mcp.json` (shared servers).","**Onboarding detail:** committed `deny` and `ask` rules apply immediately; committed `allow` rules wait until each teammate trusts the folder.",'**Managed policy (admins):** `managed-settings.json` (or MDM / server-managed from the console), a managed CLAUDE.md via `claudeMd`, `permissions.disableBypassPermissionsMode` and `disableAutoMode` set to `"disable"`, `allowManagedHooksOnly`, `managedMcpServers`, and marketplace allowlists that can force-install plugins.',"Since v2.1.257, `bypassPermissions` can't be switched on from project or local settings, so a malicious repo can't enable it for you.","**Also:** OpenTelemetry monitoring, periodic `/permissions` audits, `ConfigChange` hooks to audit settings changes, `/security-review`, dev containers.","**Cherny's loop:** tag `@.claude` on PRs so lessons flow back into the shared CLAUDE.md."),example:{title:"What a team-ready repo contains",steps:[{label:"Tree",code:"CLAUDE.md\n.mcp.json\n.claude/\n  settings.json\n  rules/api.md\n  skills/verify/SKILL.md\n  skills/release/SKILL.md\n  agents/code-reviewer.md\n.gitignore   ← includes .claude/*.local.* and .claude/worktrees/"}],result:"A new teammate clones, trusts the folder, and immediately works the same way as everyone else."},caveman:"Team: put config in repo. Everyone same Claude. Boss rule (managed) beat all. Deny work now, allow wait for trust.",quiz:[{q:"When do committed `allow` rules take effect for a teammate?",options:["Immediately","After they trust the folder","Never","After a week"],answer:1,why:"Deny/ask apply immediately; allow waits for trust."},{q:"Can a cloned repo enable bypassPermissions for you via project settings?",options:["Yes","No, ignored since v2.1.257","Only on macOS","Only with MCP"],answer:1,why:"A safety change against malicious repos."},{q:"Which file shares MCP servers with the team?",options:[".mcp.json","~/.claude.json","CLAUDE.local.md","package-lock.json"],answer:0,why:"Project-scope MCP config lives in .mcp.json."}],sources:[{label:"Settings",url:S+"settings"}]},{id:"l6-workflow",title:"The professional workflow",minutes:8,intuition:((...e)=>e.join("\n"))("Experienced users have converged on a calm, repeatable pattern: **design doc → plan → build in parallel worktrees → adversarial review → human approval.** Their setups are surprisingly plain."),analogy:((...e)=>e.join("\n"))("A film production: script (design doc), storyboard (plan), multiple crews shooting scenes at once (worktrees), an editor who wasn't on set (fresh review), and the director's final cut (you)."),formal:((...e)=>e.join("\n"))("- **From November's biggest setup discussion (Hacker News):** Opus 5.5 at medium effort, several sessions each in its own worktree, subagents for review and large searches, and a design doc, then a plan, then adversarial review before code. Codex is often used as a second-opinion reviewer.","- **Cherny's setup is mostly vanilla:** a ~2.5k-token shared CLAUDE.md, a few slash commands, one formatter hook, permission allowlists.","- **Abandon freely:** dropping 10 to 20% of runs is normal.","- **The supervision paradox:** Anthropic's own engineers worry about skills atrophying as they delegate more, while supervising Claude well needs exactly those skills. Keep humans in the review seat: read diffs, review in fresh contexts, take over after repeated failed rounds.","- **Watch for:** “A year after the 100% AI mandate nobody understands our code” struck a nerve in November (though commenters suspected the post itself was AI-written bait)."),example:{title:"One feature, the pro way",steps:[{label:"Design",code:"› interview me and write docs/design/export.md"},{label:"Plan",code:"/plan implement docs/design/export.md in 3 independent parts"},{label:"Build",code:"claude -w export-api · claude -w export-ui · claude -w export-tests"},{label:"Review",code:"(fresh session) › adversarially review the three branches against\n  the design doc. Only real gaps."},{label:"Human",text:"You read the diffs, run the app, merge."}],result:"Fast, parallel, and still understood by a human."},caveman:"Pro way: write design, make plan, many worktree, fresh reviewer, human say yes. Setup simple. Keep own brain sharp.",quiz:[{q:"Claude Code's creator's personal setup is…",options:["40 custom subagents","Mostly vanilla: short CLAUDE.md, few commands, one hook","Dozens of MCP servers","Bypass mode always"],answer:1,why:"The experts creators cite run plain setups."},{q:"What is the “supervision paradox”?",options:["Agents supervise each other","Overseeing Claude needs the skills that over-delegation erodes","A billing rule","A git error"],answer:1,why:"Named in Anthropic's internal research."},{q:"Abandoning 10–20% of runs is…",options:["A sign you're bad at it","Normal; cheaper than rescuing a bad run","Against the rules","Impossible"],answer:1,why:"Cherny reports abandoning that share."}],sources:[{label:"How AI is transforming work at Anthropic",url:"https://anthropic.com/research/how-ai-is-transforming-work-at-anthropic"},{label:"InfoQ: Claude Code creator's workflow",url:"https://www.infoq.com/news/2026/01/claude-code-creator-workflow"}]},{id:"l6-evidence",title:"Hype vs evidence: measure yourself",minutes:8,intuition:((...e)=>e.join("\n"))("“10× productivity” headlines have no data behind them. The best independent study found experienced developers were **19% slower** with early-2025 AI tools while **believing** they were 20% faster. Feelings are a poor instrument, so measure your own work."),analogy:((...e)=>e.join("\n"))("A new running shoe that “makes you 10× faster.” You'd time yourself on the same route before believing it. Do the same with your tools."),formal:((...e)=>e.join("\n"))("- **METR, July 2025 (randomized):** 16 experienced open-source developers, 246 real issues; AI-allowed tasks took **19% longer**; developers expected 24% faster and afterwards believed ~20% faster. Mostly Cursor with Claude 3.5/3.7; METR now marks it out of date.","- **METR, Feb 2026 update:** 57 developers, 800+ tasks; speedups of 18% (returning) and 4% (new), confidence intervals crossing zero. METR calls it “very weak evidence.”","- **Anthropic internal (self-reported):** ~+50% productivity, +67% merged PRs per engineer per day, 27% of work wouldn't otherwise have been done. Anthropic flags selection, social-desirability and recall bias.","- **Fair reading:** modern agentic tooling probably gives positive but modest-to-moderate per-task speedups, plus real **scope expansion** that speed metrics miss.","- **What's genuinely under-used:** verification setups and custom agents. Not “hidden features”."),example:{title:"A one-week personal experiment",steps:[{label:"Pick 10 similar tasks",text:"E.g. small bug fixes of similar size."},{label:"Alternate",text:"Do 5 with Claude Code, 5 without, alternating to avoid a learning effect."},{label:"Record",text:"Start/stop time, rework needed afterwards, bugs found in review."},{label:"Compute",text:"Say 5 tasks averaged 50 min without and 38 min with, plus 6 min rework: (50 − 44) / 50 = **12% faster**, not 10×. Now you know your real number."}],result:"An honest, personal baseline that beats any headline, and tells you which task types benefit most."},caveman:"10x claim no proof. Study: people feel faster, were slower. Measure self. Real gain from verify habit, not hidden trick.",quiz:[{q:"In METR's 2025 trial, AI-allowed tasks took…",options:["10× less time","19% longer","Exactly the same","50% less time"],answer:1,why:"And developers believed they were ~20% faster."},{q:"Anthropic's +67% merged PRs figure is…",options:["A randomized trial","Internal and self-reported, with bias flagged by Anthropic","From METR","Made up by creators"],answer:1,why:"Anthropic lists the biases itself."},{q:"Which “underused” claim has the best support?",options:["Secret hidden commands","Verification loops","Installing 40 subagents","Bypass mode"],answer:1,why:"Broad expert consensus, even without a controlled study."}],sources:[{label:"METR 2025 study",url:"https://metr.org/blog/2025-07-10-early-2025-ai-experienced-os-dev-study/"},{label:"METR 2026 update",url:"https://metr.org/blog/2026-02-24-uplift-update/"}]}]}],j="https://code.claude.com/docs/en/",E={id:"l7",num:7,title:"Beyond code (bonus)",rank:"Polymath",tagline:"Data analysis, research writing and everyday automation with the same agent.",goal:"Use Claude Code for one real non-coding job, with the same verification discipline you use for code.",project:{title:"A trustworthy analysis",brief:"Take a real CSV from your work or studies. Have Claude write a script that cleans it, computes three numbers and draws one chart, then check one number by a second method.",checklist:["Raw data folder protected with a deny rule","Claude wrote analysis.py (or .R) and ran it; outputs saved to files","You recomputed one number a different way and it matched","Saved the workflow as a skill or a `claude -p` script for next time"]},lessons:[{id:"l7-general",title:"A general agent wearing a coder's badge",minutes:6,intuition:((...e)=>e.join("\n"))("Claude Code works on **anything you can do from a command line**. Files, spreadsheets, PDFs, notes, scripts and data are all in reach.","So the same tool that fixes bugs can clean a dataset, reorganize a folder of notes, or draft and check a report."),analogy:((...e)=>e.join("\n"))("A Swiss Army knife marketed as a bottle opener. Most people only use the opener because that's what's on the box. The blade, the scissors and the screwdriver were there all along."),formal:((...e)=>e.join("\n"))("- The official docs describe it as handling “anything you can do from the command line.”","- Writer Simon Willison calls it a general agent disguised as a developer tool.","- Anthropic reports its own non-engineering teams (such as marketing, legal, data science and design) using Claude Code.","- Creator videos on “second brain” setups (Obsidian + Claude Code) show the same idea for personal knowledge work.","**What carries over from coding:**","- Work in a folder under git, so every change is reversible.","- Describe the outcome, the files, the constraints and the proof.","- Prefer outputs you can check (a script, a file, a table) over answers you have to trust."),example:{title:"Three non-coding jobs",steps:[{label:"Folder cleanup",code:"› rename every PDF in papers/ to Author_Year_ShortTitle.pdf using\n  each file's first page. Show me the mapping before renaming."},{label:"Notes",code:"› merge my meeting notes in notes/2026-11/ into one summary with\n  decisions and owners. Link each point to its source file."},{label:"Spreadsheet",code:"› in budget.csv, flag rows where the category is missing and\n  write the cleaned file to budget_clean.csv. Don't touch the original."}],result:"Each job asks for a preview, a source trail, or a separate output file, so you can check before trusting."},caveman:"Claude Code not only code. Any command-line job: file, data, note, report. Same rule: git, clear ask, proof.",quiz:[{q:"Which best describes Claude Code's scope?",options:["Only Python and JavaScript","Anything you can do from a command line","Only GitHub repos","Only web apps"],answer:1,why:"The docs say it handles anything you can do from the command line."},{q:"Why ask Claude to show a renaming map before renaming files?",options:["It's faster","So you can check before an action that's hard to undo","Required by macOS","To use more tokens"],answer:1,why:"Preview first, especially for bulk changes."},{q:"What carries over from coding to non-coding work?",options:["Nothing","Git, precise requests and checkable outputs","Only plan mode","Only hooks"],answer:1,why:"The same discipline applies."}],sources:[{label:"How Claude Code works",url:j+"how-claude-code-works"}]},{id:"l7-data",title:"Data analysis you can trust",minutes:9,intuition:((...e)=>e.join("\n"))("Never ask Claude for a number. Ask it for **a script that produces the number**, run it, and keep it.","A script can be re-run, read, checked and reused. A number typed in a chat reply can't."),analogy:((...e)=>e.join("\n"))("A lab notebook vs a colleague shouting a result across the room. Both may be right, but only the notebook lets you, a reviewer, or future-you see exactly how it was obtained."),formal:((...e)=>e.join("\n"))("**The trustworthy-analysis loop:**","1. **Protect raw data.** Keep originals read-only, e.g. a deny rule `Edit(./data/raw/**)`, and write outputs elsewhere.","2. **Explore first.** “Describe the columns, types, missing values and row count of data/raw/sales.csv.”","3. **Script, don't chat.** “Write analysis.py that computes X, Y, Z and saves a chart to out/fig1.png. Run it.”","4. **Sanity checks.** Row counts before and after cleaning, units, ranges, duplicates.","5. **Cross-check one number** by a different method (a pivot table, a second library, a hand calculation on a subset).","6. **Save it.** Commit the script; turn the routine into a skill or a `claude -p` call.","Use plan mode for multi-step analyses, and ask for evidence: the command it ran and the printed output."),example:{title:"Average order value, checked twice",setup:"orders.csv has 1,200 rows; 48 have a missing amount.",steps:[{label:"Ask for a script",code:"› write aov.py: drop rows with missing amount, report rows kept,\n  total revenue and average order value. Run it."},{label:"Claude's output",code:"rows kept: 1152\ntotal revenue: 86,400.00\naverage order value: 75.00"},{label:"Check the arithmetic",text:"1,200 − 48 = **1,152** rows ✓. 86,400 ÷ 1,152 = **75.00** ✓."},{label:"Cross-check by another method",code:"› compute the same average with a pivot in DuckDB SQL and compare"}],result:"Two methods agree and the row count adds up, so you can report 75.00 with confidence, and re-run it next month."},terminal:{intro:"Simulated session in ~/thesis-data (git repo).",steps:[{cmd:"describe data/raw/orders.csv: columns, types, missing values, row count",out:["⏺ Bash(python -c \"import pandas as pd; df=pd.read_csv('data/raw/orders.csv'); print(df.info())\")","1200 rows · order_id int · date str · amount float (48 missing) · region str"]},{cmd:"write aov.py that drops missing amounts and prints rows kept, revenue and average. run it",accept:["write aov.py that drops missing amounts and prints rows kept revenue and average run it"],out:["⏺ Write(aov.py)","⏺ Bash(python aov.py)","rows kept: 1152","total revenue: 86400.00","average order value: 75.00"],note:"1,200 − 48 = 1,152 and 86,400 ÷ 1,152 = 75. Checks out."},{cmd:"save a bar chart of revenue by region to out/fig1.png",out:["⏺ Edit(aov.py) · Bash(python aov.py)","Saved out/fig1.png (4 regions)"]}]},caveman:"No ask number. Ask script that make number. Run. Raw data no touch. Check one number other way.",pitfall:"Accepting a statistic Claude states in prose without a script behind it. If it can't be re-run, it can't be trusted or reproduced.",proTip:"Ask Claude to print row counts after every cleaning step. Most data bugs show up as a surprising count.",quiz:[{q:"What should you ask Claude for in an analysis?",options:["The final number in chat","A script that computes it, which you run and keep","A guess","A screenshot of Excel"],answer:1,why:"Scripts are reproducible and checkable."},{q:"1,200 rows, 48 missing amounts dropped. Rows kept?",options:["1,248","1,152","1,200","48"],answer:1,why:"1,200 − 48 = 1,152."},{q:"How do you protect raw data from accidental edits?",options:["Ask nicely in chat","A deny permission rule on the raw folder","Rename it","Use bypass mode"],answer:1,why:"Permissions enforce; chat requests only advise."}],sources:[{label:"Permissions",url:j+"permissions"}]},{id:"l7-writing",title:"Research writing without invented facts",minutes:8,intuition:((...e)=>e.join("\n"))("Claude Code can draft, restructure and check long documents in Markdown or LaTeX. The risk is fluent text that states things nobody checked.","The fix is the same as for code: tie every claim to a source file Claude can open, and review in a fresh context."),analogy:((...e)=>e.join("\n"))("A good research assistant brings you photocopies with the quoted lines highlighted, not just a confident summary. Ask Claude for the photocopies."),formal:((...e)=>e.join("\n"))("- **Ground it:** put sources in a folder (e.g. `refs/` with PDFs or notes) and say “only cite files in refs/; if something isn't supported there, mark it TODO.”","- **Structure first:** use plan mode to agree on the outline and the argument before drafting.","- **Draft in sections**, one session or `/clear` per major section, to keep context focused.","- **Fresh-context review:** a second session or a reviewer subagent checks each claim against `refs/` and lists unsupported ones.","- **Mechanical checks:** have it build the document (e.g. compile LaTeX) and report warnings, broken references and missing citations.","- **Keep your voice:** ask for edits as diffs you accept, not wholesale rewrites, and read `/diff` before committing."),example:{title:"A literature-review section",steps:[{label:"Plan",code:"/plan outline a 1,500-word related-work section from the papers in refs/"},{label:"Draft with grounding",code:"› draft section 2.1 from the outline. Cite only files in refs/ as\n  (Author Year). Mark any claim you can't support as TODO."},{label:"Review fresh",code:"(new session) › check every citation in chapter2.tex against refs/.\n  List claims that the cited paper doesn't support."},{label:"Build",code:"› compile the thesis and list LaTeX warnings and undefined references"}],result:"A draft where every claim points at a real source, with gaps flagged as TODO instead of filled with plausible fiction."},caveman:"Draft OK. Every claim point to real file in refs/. No source? Write TODO. New session check claims. Read diff.",pitfall:"Letting Claude cite papers from memory. It can produce plausible but wrong references. Restrict citations to files you provided.",quiz:[{q:"How do you reduce invented citations?",options:["Ask for more citations","Only allow citations to files in a sources folder, mark gaps TODO","Use a bigger model","Turn on bypass mode"],answer:1,why:"Ground claims in files Claude can open."},{q:"Why review claims in a fresh session?",options:["It's cheaper","It isn't biased toward text it just wrote","Required for LaTeX","To reset limits"],answer:1,why:"Same writer/reviewer logic as code."},{q:"Best way to keep your own writing voice?",options:["Accept full rewrites","Ask for targeted edits and read the diff","Never use Claude","Use ALL CAPS"],answer:1,why:"Review changes as diffs."}],sources:[{label:"Best practices",url:j+"best-practices"}]},{id:"l7-automate",title:"Automate your weekly routine",minutes:7,intuition:((...e)=>e.join("\n"))("Anything you do every week the same way can become a skill (when you trigger it) or a scheduled `claude -p` run (when it should just happen)."),analogy:((...e)=>e.join("\n"))("Writing down your morning coffee routine so anyone can make it exactly the same way, then buying a machine with a timer."),formal:((...e)=>e.join("\n"))("- **Skill** when you want to trigger it: `.claude/skills/weekly-report/SKILL.md`, invoked as `/weekly-report` or by a matching request.",'- **Headless** when it should run unattended: `claude -p "…" --output-format json --max-budget-usd 0.50` from cron, CI or a cloud scheduled task.',"- **Hooks** for guarantees, e.g. always regenerate a chart after data changes.","- **Guardrails for unattended runs:** cap budget and turns, restrict tools with `--allowedTools`, use `--bare` in untrusted folders, write outputs to files, and keep originals untouched.","- **Review the first few runs** before trusting it unattended."),example:{title:"Monday summary of last week's data",steps:[{label:"weekly.sh",code:'#!/bin/sh\ncd ~/lab-data\nclaude -p "run report.py on data/raw/week.csv, then write a 5-bullet summary\n  of changes vs last week to out/summary.md. Don\'t edit data/raw." \\\n  --allowedTools "Bash(python report.py *)" "Read" "Write" \\\n  --max-budget-usd 0.50 --output-format json > out/run.json'},{label:"Schedule",code:"# crontab -e\n0 8 * * 1  ~/lab-data/weekly.sh"}],result:"Every Monday at 08:00 a capped, tool-restricted run leaves a summary file and a JSON log you can audit."},caveman:"Do same thing every week? Make skill (you start) or claude -p + cron (auto). Cap money. Few tools. Check first runs.",quiz:[{q:"A task should run every Monday without you. Best fit?",options:["A skill","claude -p from a scheduler","CLAUDE.md line","Plan mode"],answer:1,why:"Headless runs are for unattended jobs."},{q:"Which guardrail limits cost of an unattended run?",options:["--max-budget-usd","--verbose","/clear","ultrathink"],answer:0,why:"Caps spend per run."},{q:"Why restrict --allowedTools in automation?",options:["Style","Nobody is watching, so limit what it can do","It's required","To speed up git"],answer:1,why:"Least privilege for unattended agents."}],sources:[{label:"Run Claude Code programmatically",url:j+"headless"}]}]},T=[...x,...C,...N,E],P=T.filter(e=>e.num<=6),A=P.map(e=>(e.lessons[1]??e.lessons[0]).quiz[0]),L=P.flatMap(e=>e.lessons.flatMap(e=>e.quiz)),I=(e,t,n,r,a,o)=>({id:e,level:t,topic:n,q:r,recommended:a,keywords:o}),O=[I("g1",0,"basics","Explain to a friend how Claude Code differs from chatting with Claude.","Chat returns text you act on yourself. Claude Code is an agentic harness that acts in your project: it gathers context (reads files), takes action (edits, runs commands) and verifies results (tests, builds), in a loop, while you approve and steer.",["act","files","commands","loop","verify"]),I("g2",0,"skills","You've never coded. What five habits will make you effective with Claude Code anyway?","Specify precisely (what, where, proof), give Claude a check it can run, keep one task per session with /clear, review evidence and diffs instead of trusting “done”, and use git commits as real save points.",["specific","check","clear","evidence","git"]),I("g3",0,"install","Your Claude Code bill shows API charges even though you pay for Max. What's the likely cause and fix?","ANTHROPIC_API_KEY is set in your shell, so Claude Code uses it instead of your subscription. Remove it from your shell profile, restart the terminal, /logout and log in again; check with claude doctor.",["ANTHROPIC_API_KEY","shell","subscription","logout"]),I("g4",0,"first session","Walk me through a good first session in a new project.","cd into the project (under git), run claude, ask what the project does and how it's structured, make one small change, approve it, check it works, then ask Claude to commit with a descriptive message.",["git","ask","small change","commit"]),I("g5",1,"keys","Name the three keys that run most sessions and what each does.","Esc interrupts (keeps work so far), Esc Esc on an empty prompt opens rewind, Shift+Tab cycles permission modes.",["Esc","rewind","Shift+Tab","mode"]),I("g6",1,"permissions","A teammate added an allow rule for `Bash(git *)` but there's also a deny for `Bash(git push *)`. Can Claude push? Why?","No. Rules are evaluated deny → ask → allow and the first match wins regardless of specificity, so the deny matches first and an allow can never carve an exception out of a deny.",["deny","first match","order","no"]),I("g7",1,"permissions","When is `--dangerously-skip-permissions` acceptable?","Only inside an isolated container, VM or the sandbox runtime. It checks nothing. Outside a box, pre-allow safe commands instead. It's also ignored from project/local settings since v2.1.257.",["container","VM","sandbox","allow"]),I("g8",1,"context","Why does /clear between unrelated tasks matter even with a 1M-token window?","Every request re-sends the whole conversation, so old tasks are re-read on every turn of the new one: more cost, slower, and more confusion. /clear costs nothing and the old session stays resumable.",["re-send","every turn","cost","resumable"]),I("g9",1,"checkpoints","Claude ran `rm -rf build/` and deleted the wrong folder. Will /rewind bring it back?","No. Checkpoints track only Claude's file-editing tools; changes made through Bash or external processes aren't restored. Git (or backups) is the real undo, which is why you work in a git repo.",["no","Bash","not tracked","git"]),I("g10",1,"commands","Which command shows what's filling your context, and which shows cost and limits?","/context shows a colored grid of what fills the window. /usage (aliases /cost and /stats) shows session cost and plan-limit bars.",["/context","/usage"]),I("g11",2,"memory","What should and shouldn't go in CLAUDE.md?","Should: exact build/test/lint commands, places the code misleads, decisions not in the repo, anything you've corrected twice. Shouldn't: architecture tours, generic style advice, ALL-CAPS shouting, secrets. Keep it under ~200 lines; it's advisory, so enforce hard rules with permissions or hooks.",["commands","gotchas","short","advisory","hooks"]),I("g12",2,"memory","What happens to an instruction you only typed in chat once auto-compaction runs?","It can be lost in the summary. The project-root CLAUDE.md is re-read from disk, so any correction you repeat belongs there.",["lost","compaction","CLAUDE.md","disk"]),I("g13",2,"rules","How do you give API-specific guidance without loading it for frontend work?",'Put it in .claude/rules/api.md with `paths:` frontmatter like ["src/api/**/*.ts"]. It loads only when Claude reads a matching file.',["rules","paths","frontmatter","matching"]),I("g14",2,"planning","Describe the recommended workflow for a medium-sized feature and when to skip a step.","Explore → plan → implement → commit. Use plan mode (Shift+Tab or /plan) to read and propose without edits, refine the plan (Ctrl+G to edit), then implement and commit. Skip the plan if you could describe the diff in one sentence.",["explore","plan","implement","commit","one sentence"]),I("g15",2,"prompting","How do you ask for deeper reasoning in late 2026? What no longer works?","Use /effort (low, medium, high, xhigh, max) or --effort, or ultrathink for one turn. The think / think hard / think harder keywords are no longer recognized.",["/effort","ultrathink","think","no longer"]),I("g16",2,"spec","Describe the interview-to-spec pattern and why the build happens in a fresh session.","Ask Claude to interview you one question at a time and write SPEC.md without coding. Then /clear (or a new session) and implement from SPEC.md. The build starts from a precise, written target without the interview clutter; precision in the spec pays off more than watching the build.",["interview","SPEC.md","fresh","precise"]),I("g17",3,"verification","Why is verification called the most important habit? Give three kinds of checks.","Without a check, “looks done” is the only signal and you become the verification loop; with one, Claude iterates until it passes and shows evidence. Checks: tests (unit, end-to-end, property), builds/linters/typecheck, and screenshot comparison for UI.",["check","tests","build","screenshot","evidence"]),I("g18",3,"TDD","What exact instructions make a TDD loop with Claude safe?","First: write a failing test that reproduces the bug, don't fix yet. Confirm it fails for the right reason. Then: make it pass without modifying the test, and run the full suite.",["failing test","don't fix","without modifying","suite"]),I("g19",3,"review","Why review in a fresh session, and what should you tell the reviewer?","A fresh context isn't biased toward code it just wrote. Tell it to report only correctness bugs and requirement gaps, because reviewers over-report and that leads to over-engineering.",["fresh","biased","only","correctness"]),I("g20",3,"worktrees","How do you run two Claude sessions on the same repo without collisions?","Give each its own worktree: claude --worktree <name> (or -w), which creates .claude/worktrees/<name> on its own branch. Add .claude/worktrees/ to .gitignore and list needed gitignored files in .worktreeinclude.",["worktree","branch",".gitignore",".worktreeinclude"]),I("g21",3,"git","How does Claude open a PR and how can you return to that session later?","Ask it to create a PR; it uses gh pr create (glab for GitLab) and links the session to the PR. Reopen with claude --from-pr <number>.",["gh","pr create","--from-pr"]),I("g22",4,"extensions","Map each need to an extension: always-on knowledge, a repeatable procedure, a noisy search, a guaranteed rule, an outside system.","CLAUDE.md, skill, subagent, hook (or permission rule), MCP server (or a CLI if one exists). Plugins bundle them.",["CLAUDE.md","skill","subagent","hook","MCP"]),I("g23",4,"skills","What is progressive disclosure in skills and why does it matter?","Only each skill's name and description sit in context; the full SKILL.md (and extra files) load only when invoked. So many skills cost almost nothing until used. That's why the description must say what it does and when to use it.",["description","only","invoked","context"]),I("g24",4,"skills","What happened to custom slash commands?","They merged into skills. .claude/commands/x.md and .claude/skills/x/SKILL.md both create /x; old command files still work, the skill wins on a name clash, and skills are recommended for new work.",["merged","skills","still work","wins"]),I("g25",4,"subagents","Write the minimum frontmatter for a read-only reviewer subagent and say where the file goes.","In .claude/agents/code-reviewer.md: name: code-reviewer, description: when to use it, tools: Read, Glob, Grep (and optionally model: sonnet). The body is its system prompt.",["name","description","tools",".claude/agents"]),I("g26",4,"hooks","Your PreToolUse hook prints an error and exits 1, but the command still runs. Why?","Exit 1 doesn't block. Only exit 2 blocks (or exit 0 with JSON permissionDecision: deny).",["exit 2","exit 1","block","permissionDecision"]),I("g27",4,"MCP","Add an HTTP MCP server for Notion and explain the three scopes.","claude mcp add --transport http notion https://mcp.notion.com/mcp. Scopes: local (default, private, ~/.claude.json), project (.mcp.json at repo root, committed), user (all your projects).",["--transport http","local","project",".mcp.json","user"]),I("g28",4,"MCP","Is “every MCP server eats your context” still true?","Mostly not: tool search is on by default, so only tool names and server instructions load at startup. But CLIs like gh, aws and gcloud are still more context-efficient, and plugins/skills add descriptions every turn.",["tool search","names","CLI","gh"]),I("g29",4,"plugins","What's the main risk of plugins and how do you manage it?","A plugin can run code with your user privileges. Install only from trusted publishers (e.g. the official marketplace), read what it contains, and watch the context-cost estimate. A backdoored Claude Code extension appeared on Open VSX in Oct 2026.",["privileges","trusted","official","context cost"]),I("g30",5,"headless","Write a one-liner that summarizes the last 20 commits non-interactively, and name two useful flags.",'git log --oneline -20 | claude -p "summarize these recent commits". Useful flags: --output-format json, --max-budget-usd, --max-turns, --allowedTools, --bare.',["claude -p","pipe","--output-format","--max-budget-usd"]),I("g31",5,"headless","Why run `claude -p` with --bare in a repo you don't trust?","Without --bare, -p executes the project's hooks and .mcp.json servers with no trust dialog. --bare skips hooks, skills, plugins, MCP, memory and CLAUDE.md discovery (and needs an API key).",["hooks","trust","--bare","skips"]),I("g32",5,"CI","Upgrading claude-code-action from @beta to @v1: what changes?","Remove mode, rename direct_prompt to prompt, move max_turns and model into claude_args, replace custom_instructions with --append-system-prompt.",["mode","prompt","claude_args","append-system-prompt"]),I("g33",5,"SDK","What's the Agent SDK called now, and what changed about its system prompt?","Claude Agent SDK (@anthropic-ai/claude-agent-sdk, Python claude-agent-sdk, ClaudeAgentOptions). Since v0.1.0 it doesn't use Claude Code's system prompt by default; pass the claude_code preset.",["Agent SDK","claude-agent-sdk","preset","system prompt"]),I("g34",5,"cost","Name four levers to cut Claude Code cost, roughly by impact.","Model choice (Sonnet for most coding, Haiku for simple subagents), lower /effort for routine work, /clear between tasks and a lean CLAUDE.md, and delegating noisy output (test logs) to subagents or filtering it with a hook.",["Sonnet","effort","/clear","subagent"]),I("g35",5,"cost","You hit your weekly limit. Will switching models help?","No. Session and weekly limits apply across all models. Switching only helps after a model-specific limit such as an Opus limit. Usage credits (/usage-credits) can buy overflow.",["no","all models","Opus limit","credits"]),I("g36",6,"security","List three real incidents and the lesson from each.","Dec 2025 rm -rf with a trailing ~/ wiped a home directory → git, backups, permissions and sandbox. Nov 2026 secrets saved via “Don't ask again” into settings.local.json and committed → gitignore .claude/*.local.* and scan secrets. Oct 2026 backdoored VS Code extension on Open VSX → official publishers only.",["rm -rf","settings.local.json","extension","gitignore"]),I("g37",6,"security","Is the sandbox on by default? What does it limit and not limit?","Off by default; enable with /sandbox. It limits writes to the working directory and routes network through an allowlist that starts empty, but reads cover most of the machine, including ~/.ssh. Set failIfUnavailable and disable unsandboxed commands to close escape hatches.",["off","writes","network","reads","~/.ssh"]),I("g38",6,"team","What does a team commit to the repo so everyone gets the same Claude?",".claude/settings.json (permissions, hooks), CLAUDE.md and .claude/rules/, .claude/skills/, .claude/agents/, and .mcp.json. Deny/ask rules apply immediately; allow rules after each teammate trusts the folder.",["settings.json","CLAUDE.md","skills","agents",".mcp.json"]),I("g39",6,"evidence","A video says Claude Code makes you 10× faster. What does the evidence say?","No data supports 10×. METR's 2025 randomized trial found experienced devs 19% slower while believing they were 20% faster; its 2026 update found 4–18% speedups with intervals crossing zero (“very weak evidence”). Anthropic's internal +50% / +67% PRs are self-reported with acknowledged bias. Measure your own tasks.",["METR","19%","slower","self-reported","measure"]),I("g40",6,"workflow","Describe the professional workflow and the supervision paradox.","Design doc → plan → build in parallel worktrees → fresh/adversarial review → human review and merge, with a plain setup. The supervision paradox: overseeing Claude well needs the very skills over-delegation erodes, so keep humans reading diffs and reviewing.",["design","plan","worktree","review","skills"])],z=[{claim:"You're using Claude Code wrong if you don't give it a way to check its work.",verdict:"Supported",reality:"The best-supported tip in the whole genre. Anthropic's docs, Claude Code's creator Boris Cherny, the Claude Code team's Nov 2026 verification post and the power-user guide all rank it first. Support comes from expert consensus, not a controlled study; Cherny's “2-3× quality” is his own estimate."},{claim:"Claude Code will make you 10× more productive.",verdict:"Hype",reality:"No measurement comes close. METR's 2025 randomized trial: experienced devs **19% slower** while believing they were 20% faster. METR's 2026 update: 4–18% speedups with intervals crossing zero, “very weak evidence.” Anthropic's internal +50% productivity is self-reported, with biases it flags itself."},{claim:"You're only using 20% of Claude Code.",verdict:"Hype",reality:"Headlines like this come with no usage data. The features they list are real (plan mode, CLAUDE.md, subagents, hooks, worktrees) and mostly come from Anthropic's best-practices page, but the percentage is invented."},{claim:"Custom agents (subagents) are the most overlooked feature.",verdict:"Partly true",reality:"Anthropic's own support article says custom agents “often get overlooked.” That's first-party support, but there's no measurement of their impact. Anthropic also lists “subagents just to save context” as a habit you can stop."},{claim:"Install these 40 subagents / 50 MCP servers to supercharge Claude Code.",verdict:"Hype",reality:"The opposite of expert practice. Cherny runs a mostly vanilla setup: a ~2.5k-token CLAUDE.md, a few commands, one formatter hook. Every enabled skill, agent and plugin adds context cost, and plugins can run code with your privileges."},{claim:"Use plan mode for everything.",verdict:"Partly true",reality:"Plan first for anything non-trivial, but the docs' skip rule is: if you could describe the diff in one sentence, skip the plan."},{claim:"Write a huge, detailed CLAUDE.md with IMPORTANT rules in caps.",verdict:"Hype",reality:"Current docs list ALL-CAPS/IMPORTANT and architecture tours under “what you can stop doing.” Keep it under 200 lines, only what Claude can't infer."},{claim:"Run multiple Claude sessions in parallel to multiply output.",verdict:"Partly true",reality:"Real and recommended (3 to 5 worktree sessions), but it multiplies review load and token use. Agent teams use ~7× more tokens; November's top complaint was parallel agents burning limits in minutes."},{claim:"You don't need to know how to code.",verdict:"Supported",reality:"The official terminal guide says exactly this. To use it well you still need to specify, verify and review, and git literacy is your safety net."}],_=[{pattern:"“FULL COURSE (4 / 10+ hours)”",example:"CLAUDE CODE FULL COURSE 4 HOURS: Build & Sell (2026), ~2.4M views",inside:"Long beginner walkthroughs: install, first project, then a build-and-ship demo. The biggest view counts in the genre.",watchIf:"you like long-form, follow-along learning. Check the date: anything before late 2026 has outdated commands."},{pattern:"“Build $10,000 websites / a $400K/mo app”",example:"How I Vibe Coded a $400K/mo App with Claude Code",inside:"Money framing. Mostly demos of building fast; the revenue claims are not verifiable.",watchIf:"you want inspiration for what's possible, not engineering technique."},{pattern:"“No coding needed / for non-technical beginners”",example:"Claude Code Tutorial for Non-Technical Beginners",inside:"Desktop/web-first onboarding, plain-English prompting, small projects.",watchIf:"you're at Level 0 and the terminal feels scary."},{pattern:"“I spent 800 / 1,000+ hours with Claude Code”",example:"800+ hours of Learning Claude Code in 8 minutes",inside:"Compressed tips lists: CLAUDE.md, plan mode, context hygiene, custom commands. Usually a remix of official best practices.",watchIf:"you want a quick tour, then read the official best-practices page to confirm each tip."},{pattern:"“You're using Claude Code wrong”",example:"You're Using Claude Code Wrong (And Wasting Hours Every Day)",inside:"Correction lists. The genuinely solid ones focus on verification, plan mode and /clear.",watchIf:"you're at Level 2–3. Use the Hype vs reality tab to filter claims."},{pattern:"“How the creator of Claude Code uses it”",example:"Boris Cherny shares these 22 tips (you're probably using it wrong)",inside:"Retellings of Cherny's Jan 2026 thread: verification first, plan then auto-accept, parallel sessions, shared CLAUDE.md, a formatter hook. Often with an added “10×” hook he didn't claim.",watchIf:"you want the closest thing to an expert's real setup (read the InfoQ summary instead for accuracy)."},{pattern:"“Second brain / run my life with Obsidian + Claude Code”",example:"How I Use Obsidian + Claude Code to Run My Life",inside:"Non-coding uses: notes, planning, writing, personal automation. Shows Claude Code as a general agent.",watchIf:"you want to use it beyond programming."},{pattern:"“Claude Code vs Codex vs Cursor (cost / speed)”",example:"Claude Code vs Cline vs Codex: Why the Same Task Costs So Much More",inside:"Tool and pricing comparisons. Useful context, but prices and plans change monthly (Max 20x became Ultra on Nov 1, 2026).",watchIf:"you're choosing tools or plans; re-check prices on the official page."}],D=[{tag:"security · ~1.6k HN points",title:"Account email appeared in User-Agent headers",body:"The email sat in model context and sometimes ended up in outgoing requests. v2.1.317 now asks before a web or shell call sends it."},{tag:"security · ~1k HN points",title:"Backdoored “Claude Code for VS Code” extension on Open VSX (Oct 30)",body:"A fake extension appeared on the Cursor/Open VSX marketplace. Install only from official publishers."},{tag:"security · 629 HN points",title:"“Don't ask again” saved secrets into settings.local.json",body:"Apiiro found such files committed in ~1,100 public repos. Add `.claude/*.local.*` to every repo's .gitignore."},{tag:"feature · v2.1.323",title:"Experimental Code Mode",body:"Claude writes JavaScript that calls its tools and returns only filtered output. Enable with `CLAUDE_CODE_EXPERIMENTAL_CODE_MODE=1` in user settings. Doesn't work with `-p`, the SDK, VS Code, Desktop or cloud sessions."},{tag:"models · Nov 9",title:"Fable 5.2 released; defaul
